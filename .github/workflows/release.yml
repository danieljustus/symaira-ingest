name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  cli-release:
    name: CLI release and Homebrew formula
    runs-on: macos-15
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7
        with:
          fetch-depth: 0

      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12:-}" ]; then
            echo "::warning::CERTIFICATE_P12 secret is not set. Building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in imported certificate."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7
        with:
          go-version: '1.26.4'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # pin@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Notarize macOS CLI binaries
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARY_API_KEY:-}" ]; then
            echo "::warning::NOTARY_API_KEY secret is not set. Skipping CLI notarization."
            exit 0
          fi
          NOTARY_KEY=$(mktemp -t notary_cli)
          echo -n "${NOTARY_API_KEY}" | base64 -d > "$NOTARY_KEY"
          chmod 600 "$NOTARY_KEY"
          for ARCH in amd64 arm64; do
            for f in dist/*_darwin_"${ARCH}"/*; do
              if [ -f "$f" ] && file "$f" | grep -q "Mach-O"; then
                echo "Notarizing $f..."
                ZIP_PATH="$RUNNER_TEMP/notarize_cli_${ARCH}.zip"
                ditto -c -k --keepParent "$f" "$ZIP_PATH"
                xcrun notarytool submit "$ZIP_PATH" \
                  --key "$NOTARY_KEY" \
                  --key-id "${NOTARY_API_KEY_ID}" \
                  --issuer "${NOTARY_API_ISSUER}" \
                  --wait
                rm -f "$ZIP_PATH"
              fi
            done
          done
          rm -f "$NOTARY_KEY"

      - name: Clean up signing material
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  macos-gui-dmg:
    name: macOS GUI DMG
    runs-on: macos-15
    permissions:
      contents: write
    environment: release
    needs: cli-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7
        with:
          fetch-depth: 0

      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12:-}" ]; then
            echo "::warning::CERTIFICATE_P12 secret is not set. Building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in imported certificate."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7
        with:
          go-version: '1.26.4'

      - name: Install packaging tools
        run: |
          set -euo pipefail
          brew install xcodegen create-dmg

      - name: Build universal symingest CLI for app bundle
        run: |
          set -euo pipefail
          GOOS=darwin GOARCH=amd64 go build -o symingest-amd64 ./cmd/symingest
          GOOS=darwin GOARCH=arm64 go build -o symingest-arm64 ./cmd/symingest
          lipo -create -output symingest symingest-amd64 symingest-arm64
          rm symingest-amd64 symingest-arm64
          file symingest
          if [ -n "${CODESIGN_IDENTITY:-}" ]; then
            codesign -f -s "$CODESIGN_IDENTITY" --timestamp --options runtime symingest
            codesign --verify --strict --verbose=2 symingest
          fi

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen --spec client/project.yml

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          xcodebuild -project client/Symingest.xcodeproj \
            -scheme Symingest \
            -resolvePackageDependencies

      - name: Build macOS SwiftUI app
        run: |
          set -euo pipefail
          xcodebuild -project client/Symingest.xcodeproj \
            -scheme Symingest \
            -configuration Release \
            -derivedDataPath build_dd \
            -destination 'platform=macOS' \
            build

      - name: Sign app bundle
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          APP_PATH="build_dd/Build/Products/Release/Symingest.app"
          APP_EXECUTABLE="$APP_PATH/Contents/MacOS/Symingest"

          while IFS= read -r -d '' item; do
            if [ "$item" = "$APP_EXECUTABLE" ]; then
              continue
            fi
            if file "$item" | grep -q "Mach-O"; then
              echo "Signing nested Mach-O: $item"
              codesign -f -s "$CODESIGN_IDENTITY" --timestamp --options runtime "$item"
              codesign --verify --strict --verbose=2 "$item"
            fi
          done < <(find "$APP_PATH/Contents" -type f -print0)

          codesign -f -s "$CODESIGN_IDENTITY" --timestamp --options runtime "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"

          while IFS= read -r -d '' item; do
            if [ "$item" = "$APP_EXECUTABLE" ]; then
              continue
            fi
            if file "$item" | grep -q "Mach-O"; then
              codesign --verify --strict --verbose=2 "$item"
            fi
          done < <(find "$APP_PATH/Contents" -type f -print0)

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p dist/dmg_staging
          cp -R build_dd/Build/Products/Release/Symingest.app dist/dmg_staging/
          create-dmg \
            --volname "Symingest" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "Symingest.app" 175 120 \
            --hide-extension "Symingest.app" \
            --app-drop-link 425 120 \
            dist/Symingest.dmg \
            dist/dmg_staging/

      - name: Sign and notarize DMG
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        run: |
          set -euo pipefail
          codesign -f -s "$CODESIGN_IDENTITY" --timestamp --options runtime dist/Symingest.dmg
          codesign --verify --verbose=2 dist/Symingest.dmg
          if [ -z "${NOTARY_API_KEY:-}" ]; then
            echo "::warning::NOTARY_API_KEY secret is not set. Skipping DMG notarization."
            exit 0
          fi
          NOTARY_KEY=$(mktemp -t notary_dmg)
          echo -n "${NOTARY_API_KEY}" | base64 -d > "$NOTARY_KEY"
          chmod 600 "$NOTARY_KEY"
          NOTARY_OUTPUT="$RUNNER_TEMP/notarytool-dmg-submit.json"
          if ! xcrun notarytool submit dist/Symingest.dmg \
            --key "$NOTARY_KEY" \
            --key-id "${NOTARY_API_KEY_ID}" \
            --issuer "${NOTARY_API_ISSUER}" \
            --wait \
            --output-format json | tee "$NOTARY_OUTPUT"; then
            SUBMISSION_ID=$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$NOTARY_OUTPUT" 2>/dev/null || true)
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$NOTARY_KEY" \
                --key-id "${NOTARY_API_KEY_ID}" \
                --issuer "${NOTARY_API_ISSUER}" || true
            fi
            rm -f "$NOTARY_KEY"
            exit 1
          fi
          rm -f "$NOTARY_KEY"
          xcrun stapler staple dist/Symingest.dmg
          xcrun stapler validate dist/Symingest.dmg
          spctl -a -t open --context context:primary-signature -v dist/Symingest.dmg

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # pin@v3
        with:
          files: dist/Symingest.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7
        with:
          name: Symingest.dmg
          path: dist/Symingest.dmg
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  update-homebrew-cask:
    name: Update Homebrew Cask
    runs-on: ubuntu-latest
    needs: macos-gui-dmg
    if: success()
    permissions:
      contents: read
    steps:
      - name: Compute DMG checksum
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          DMG_URL="https://github.com/danieljustus/symaira-ingest/releases/download/${VERSION}/Symingest.dmg"
          echo "Downloading $DMG_URL ..."
          curl -fsSL -o /tmp/Symingest.dmg "$DMG_URL"
          SHA256=$(sha256sum /tmp/Symingest.dmg | cut -d' ' -f1)
          echo "SHA256: $SHA256"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CLEAN=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7
        with:
          repository: danieljustus/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap

      - name: Write Cask
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          cat > tap/Casks/symingest.rb << 'CASKRB'
          cask "symingest" do
            version "${VERSION_CLEAN}"
            sha256 "${SHA256}"

            url "https://github.com/danieljustus/symaira-ingest/releases/download/v#{version}/Symingest.dmg",
                verified: "github.com/danieljustus/symaira-ingest/"
            name "Symingest"
            desc "Document ingestion + OCR pipeline for the Symaira ecosystem"
            homepage "https://github.com/danieljustus/symaira-ingest"

            depends_on macos: ">= :ventura"

            app "Symingest.app"

            zap trash: [
              "~/Library/Application Support/Symingest",
              "~/Library/Preferences/dev.symaira.symingest.plist",
              "~/Library/Logs/Symingest",
            ]
          end
          CASKRB

          # Replace templated variables with actual values
          sed -i "s/\${VERSION_CLEAN}/${VERSION_CLEAN}/g" tap/Casks/symingest.rb
          sed -i "s/\${SHA256}/${SHA256}/g" tap/Casks/symingest.rb

      - name: Commit and push Cask
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/symingest.rb
          if git diff --cached --quiet; then
            echo "Cask unchanged, skipping commit."
            exit 0
          fi
          git commit -m "Update symingest cask to ${VERSION}"
          git push