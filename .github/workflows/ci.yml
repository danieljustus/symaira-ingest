name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '47 5 * * 1'  # weekly Monday 05:47 UTC — full suite incl. macOS client

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  go:
    name: Go CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Lint
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build CGO-free binary
        run: CGO_ENABLED=0 go build ./cmd/symingest

      - name: Verify CLI help
        run: ./symingest --help

  macos-client:
    name: macOS client build
    if: github.event_name != 'pull_request'  # PR gate = Go CLI only; client build on main/schedule
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7
        with:
          go-version: '1.26.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build embedded symingest binary
        run: go build -o symingest ./cmd/symingest

      - name: Generate Xcode project
        run: xcodegen --spec client/project.yml

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -project client/Symingest.xcodeproj \
            -scheme Symingest \
            -resolvePackageDependencies

      - name: Build macOS app
        run: |
          xcodebuild -project client/Symingest.xcodeproj \
            -scheme Symingest \
            -configuration Release \
            -derivedDataPath build_dd \
            -destination 'platform=macOS' \
            build
