name: Import signing certificate
description: >
  Import a macOS signing certificate from secrets into a temporary keychain.
  Sets CODESIGN_IDENTITY and KEYCHAIN_PATH as step outputs.

inputs:
  certificate_p12:
    description: Base64-encoded P12 certificate
    required: true
  certificate_password:
    description: Password for the P12 certificate
    required: true
  keychain_password:
    description: Password for the temporary keychain
    required: true

outputs:
  signed:
    description: Whether a valid signing identity was found
    value: ${{ steps.import.outputs.signed }}

runs:
  using: composite
  steps:
    - name: Import signing certificate
      id: import
      shell: bash
      env:
        CERTIFICATE_P12: ${{ inputs.certificate_p12 }}
        CERTIFICATE_PASSWORD: ${{ inputs.certificate_password }}
        KEYCHAIN_PASSWORD: ${{ inputs.keychain_password }}
      run: |
        set -euo pipefail
        if [ -z "${CERTIFICATE_P12:-}" ]; then
          echo "::warning::CERTIFICATE_P12 secret is not set. Building unsigned."
          echo "signed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "signed=true" >> "$GITHUB_OUTPUT"
        KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
        echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
        security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH"
        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
        if [ -z "$IDENTITY" ]; then
          echo "::error::No Developer ID Application identity found in imported certificate."
          exit 1
        fi
        echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
